name: Keepalive
on:
  workflow_dispatch:
  schedule:
    - cron: "7 3 * * 1"   # Mondays 03:07 UTC — off-peak to avoid queue delays
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit resets inactivity clock
        run: |
          git config user.name "keepalive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive [skip ci]"
          git push
